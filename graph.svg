<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#333"/>
    </marker>
    <style>
      .box { fill: #f7f7f7; stroke: #333; stroke-width: 1.5; rx: 8; ry: 8; }
      .text { font-family: Arial, sans-serif; font-size: 14px; fill: #111; }
      .arrow { stroke: #333; stroke-width: 1.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- Nodes -->
  <rect class="box" x="40" y="200" width="200" height="60"/>
  <text class="text" x="140" y="235" text-anchor="middle">Puppeteer Crawler</text>
  <text class="text" x="140" y="255" text-anchor="middle">cat5.ts</text>

  <rect class="box" x="300" y="200" width="200" height="60"/>
  <text class="text" x="400" y="235" text-anchor="middle">Fastify API</text>
  <text class="text" x="400" y="255" text-anchor="middle">:3001</text>

  <rect class="box" x="560" y="200" width="220" height="60"/>
  <text class="text" x="670" y="235" text-anchor="middle">PostgreSQL Database</text>
  <text class="text" x="670" y="255" text-anchor="middle">(Prisma ORM)</text>

  <rect class="box" x="560" y="340" width="220" height="60"/>
  <text class="text" x="670" y="365" text-anchor="middle">NATS Event Broker</text>
  <text class="text" x="670" y="385" text-anchor="middle">:4222</text>

  <rect class="box" x="840" y="340" width="220" height="60"/>
  <text class="text" x="950" y="365" text-anchor="middle">Image Persister</text>
  <text class="text" x="950" y="385" text-anchor="middle">Daemon</text>

  <rect class="box" x="840" y="120" width="220" height="60"/>
  <text class="text" x="950" y="145" text-anchor="middle">image.invaluable.com</text>

  <rect class="box" x="840" y="460" width="220" height="40"/>
  <text class="text" x="950" y="485" text-anchor="middle">raw/ folder</text>

  <!-- Arrows -->
  <line class="arrow" x1="240" y1="230" x2="300" y2="230"/>
  <text class="text" x="270" y="215" text-anchor="middle" font-size="12">HTTP POST</text>

  <line class="arrow" x1="500" y1="230" x2="560" y2="230"/>
  <text class="text" x="530" y="215" text-anchor="middle" font-size="12">Prisma ORM</text>

  <line class="arrow" x1="670" y1="260" x2="670" y2="340"/>
  <text class="text" x="690" y="300" font-size="12">Event Publish</text>

  <line class="arrow" x1="780" y1="370" x2="840" y2="370"/>
  <text class="text" x="810" y="355" font-size="12">Subscribe</text>

  <line class="arrow" x1="950" y1="340" x2="950" y2="180"/>
  <text class="text" x="960" y="260" font-size="12">Chromium CDN Bypass</text>

  <line class="arrow" x1="950" y1="400" x2="950" y2="460"/>
  <text class="text" x="960" y="435" font-size="12">Local Save</text>

</svg>